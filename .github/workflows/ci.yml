name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[browser,dev]"

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Check Python syntax and undefined names
        run: python -m ruff check .

      - name: Check typed security boundary modules
        run: python -m mypy

  desktop:
    name: Desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python sidecar dependencies
        run: python -m pip install ".[browser]"

      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Check desktop and extension JavaScript
        working-directory: desktop
        run: npm test

      - name: Audit production dependencies
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=moderate || (sleep 5 && npm audit --omit=dev --audit-level=moderate)

      - name: Audit complete dependency tree
        working-directory: desktop
        run: npm audit --audit-level=moderate || (sleep 5 && npm audit --audit-level=moderate)

      - name: Smoke test desktop on Linux
        if: runner.os == 'Linux'
        working-directory: desktop
        run: xvfb-run -a npm run smoke

      - name: Smoke test desktop on Windows and macOS
        if: runner.os != 'Linux'
        working-directory: desktop
        run: npm run smoke

  security-benchmarks:
    name: Controlled security benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install benchmark dependencies
        run: python -m pip install ".[dev]"

      - name: Run repeatable WSHawk benchmarks
        run: >-
          python -m benchmarks.run
          --iterations 3
          --warmup 1
          --output build/benchmarks/report.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wshawk-security-benchmarks
          path: build/benchmarks/report.json
          if-no-files-found: error
          retention-days: 30

  release-security:
    name: Release security and distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install build tools
        run: python -m pip install ".[dev]"

      - name: Run release security checks
        run: python scripts/release_security_checks.py

      - name: Audit resolved Python dependencies
        run: python -m pip_audit --progress-spinner off

      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/verify_wheel_contents.py dist/*.whl

      - name: Upload Python distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WSHawk-Python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload release security report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-security-report
          path: build/release_security_report.json
          if-no-files-found: error
