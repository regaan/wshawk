name: Build and Release WSHawk Desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.platform }} installers
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[browser]" pyinstaller

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Compile Python sidecar
        run: |
          python scripts/verify_pyinstaller_hiddenimports.py wshawk-bridge.spec
          pyinstaller wshawk-bridge.spec

      - name: Prepare sidecar on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p desktop/bin
          cp dist/wshawk-bridge desktop/bin/wshawk-bridge

      - name: Prepare sidecar on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p desktop/bin
          cp dist/wshawk-bridge.exe desktop/bin/wshawk-bridge.exe

      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Copy desktop license
        shell: bash
        run: cp LICENSE desktop/LICENSE.txt

      - name: Build ${{ matrix.platform }} installers
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish never

      - name: Validate and index ${{ matrix.platform }} installers
        shell: bash
        run: |
          python scripts/release_desktop_artifacts.py index \
            --dist desktop/dist \
            --platform "${{ matrix.platform }}" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload ${{ matrix.platform }} installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WSHawk-${{ matrix.platform }}-installers
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.pacman
            desktop/dist/SHA256SUMS-${{ matrix.platform }}.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Download all workflow artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Generate release notes and combined checksums
        shell: bash
        run: |
          python scripts/release_desktop_artifacts.py notes \
            --artifacts artifacts \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --changelog CHANGELOG.md \
            --output release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release with all installers
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: WSHawk ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.pacman
            artifacts/**/*.whl
            artifacts/**/*.tar.gz
            artifacts/**/SHA256SUMS-*.txt
            artifacts/SHA256SUMS.txt
