services:
  wshawk:
    build: .
    image: rothackers/wshawk:latest
    container_name: wshawk
    networks:
      - wshawk-network
    volumes:
      - ./reports:/app/reports
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: /bin/bash
    stdin_open: true
    tty: true
    environment:
      - PYTHONUNBUFFERED=1

  # Example: Vulnerable WebSocket server for testing
  vulnerable-server:
    image: python:3.11-slim
    container_name: wshawk-test-server
    profiles: [lab]
    ports:
      - "8765:8765"
    volumes:
      - ./examples:/app
    working_dir: /app
    command: python3 -m http.server 8765
    networks:
      - wshawk-network

networks:
  wshawk-network:
    driver: bridge
